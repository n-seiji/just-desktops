[env]
CFLAGS = "-std=gnu11 -O2 -Wall -Wextra -Wshadow -Wformat=2 -Wstrict-prototypes -Wmissing-prototypes -mmacosx-version-min=13.0 -fobjc-arc"
FRAMEWORKS = "-framework ApplicationServices -framework AppKit -framework CoreText -framework QuartzCore -F/System/Library/PrivateFrameworks -framework SkyLight -weak_framework ScreenCaptureKit"

[tasks.build]
description = "Build bin/just-desktops"
sources = ["src/*"]
outputs = ["bin/just-desktops"]
run = [
  "mkdir -p bin",
  "clang $CFLAGS src/*.m src/*.c -o bin/just-desktops $FRAMEWORKS",
  "codesign -fs - --options runtime bin/just-desktops",
]

[tasks.test]
description = "Run unit tests"
run = "scripts/run-tests.sh"

[tasks.test-san]
description = "Run unit tests under AddressSanitizer and UndefinedBehaviorSanitizer (SANITIZERS=undefined to drop one)"
run = "SAN=\"-fsanitize=${SANITIZERS:-address,undefined} -fno-sanitize-recover=all -fno-omit-frame-pointer\" scripts/run-tests.sh"

[tasks.run]
description = "Build and run in the foreground"
depends = ["build"]
run = "./bin/just-desktops"

[tasks.dist]
description = "Build release tarballs for arm64 and x86_64 (CODESIGN_IDENTITY signs with a real identity, default ad-hoc)"
run = '''
set -eu
mkdir -p dist
for arch in arm64 x86_64; do
  out="dist/$arch/just-desktops"
  mkdir -p "dist/$arch"
  clang $CFLAGS -arch "$arch" src/*.m src/*.c -o "$out" $FRAMEWORKS
  if [ "${CODESIGN_IDENTITY:--}" = "-" ]; then
    codesign -fs - --options runtime "$out"
  else
    codesign -f -s "$CODESIGN_IDENTITY" --options runtime --timestamp "$out"
  fi
  tar -czf "dist/just-desktops-darwin-$arch.tar.gz" -C "dist/$arch" just-desktops
done
'''

[tasks.app]
description = "Build dist/just-desktops.app (universal; CODESIGN_IDENTITY signs with a real identity, default ad-hoc)"
run = "scripts/build-app.sh"

[tasks.dist-app]
description = "Build the app bundle and zip it with a sha256 file"
depends = ["app"]
run = "scripts/package-app.sh"

[tasks.service]
description = "Register a LaunchAgent that starts at login"
run = '''
set -eu
bin="$(mise which just-desktops 2>/dev/null || true)"
[ -n "$bin" ] || { echo "install first: mise use -g github:n-seiji/just-desktops" >&2; exit 1; }
plist="${JD_PLIST_OUT:-$HOME/Library/LaunchAgents/com.just-desktops.plist}"
log="$HOME/Library/Logs/just-desktops.log"
mkdir -p "$HOME/Library/Logs" "$(dirname "$plist")"
scripts/service-plist.sh "$bin" "$log" > "$plist.tmp"
plutil -lint "$plist.tmp" >/dev/null
mv "$plist.tmp" "$plist"
[ -z "${JD_PLIST_OUT:-}" ] || { echo "wrote $plist (not loaded)"; exit 0; }
launchctl bootout "gui/$(id -u)/com.just-desktops" 2>/dev/null || true
launchctl bootstrap "gui/$(id -u)" "$plist"
echo "registered: $bin (log: $log)"
'''

[tasks.unservice]
description = "Stop and unregister the LaunchAgent"
run = '''
launchctl bootout "gui/$(id -u)/com.just-desktops" 2>/dev/null || true
rm -f "$HOME/Library/LaunchAgents/com.just-desktops.plist"
'''

[tasks.clean]
description = "Remove build outputs"
run = "rm -rf bin dist"
